run_name: p3v5_p1
seed: 42
output_dir: /home/ubuntu/w/host/results/llmbench_p3v5_p1

sweep:
  concurrency_levels: [1,8,32]
  prompt_length_points: [1024]
  output_tokens: 256
  requests_per_cell: 64
  warmup_requests_per_cell: 4
  vary_prompt_per_request: true

targets:
  - name: p3v5_p1
    base_url: http://127.0.0.1:30531
    model: /models/Qwen3-0.6B
    tokenizer: /home/ubuntu/w/models/Qwen3-0.6B
    max_model_len: 4096
    api_path: /v1/completions
    stream: true
    num_gpus: 4
    request_timeout_s: 1800
    extra_body:
      ignore_eos: true
      temperature: 0
